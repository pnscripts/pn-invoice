name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, dom, libxml
          coverage: none
          tools: composer:v2

      # Libraries do not commit composer.lock: resolve the newest versions for each PHP
      # (PHPUnit 12.5 on PHP 8.3, PHPUnit 13 on PHP >= 8.4.1).
      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Coding standard
        if: matrix.php == '8.4'
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Tests
        run: vendor/bin/phpunit

      - name: CLI smoke test
        run: php bin/pn-invoice validate tests/fixtures/golden/ubl-invoice-standard.xml tests/fixtures/golden/cii-invoice-standard.xml

  lowest:
    name: Lowest dependencies (PHP 8.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, dom, libxml
          coverage: none
      - run: composer update --prefer-lowest --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit
